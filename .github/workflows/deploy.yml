name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

# Let the deployment update the live site, but never cancel a run midway.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only the live site's branch deploys. Comparing against the repo's own
    # default branch rather than hard-coding a name means this keeps working if
    # the default is later renamed to main; pushes to any other branch build
    # nothing and the deploy below is skipped with them.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
